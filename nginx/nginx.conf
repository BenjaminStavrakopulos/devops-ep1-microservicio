# Balanceador de carga delante de las réplicas de la API.
# "resolve" vuelve a consultar el DNS de Docker, así las réplicas nuevas (al escalar) entran al balanceo sin reiniciar Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream productos_api {
    zone productos_api 64k;
    server api:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://productos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        # Si una réplica falla o se está apagando, se reintenta en otra
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        # Permite verificar en las pruebas de humo qué réplica respondió
        add_header X-Upstream $upstream_addr always;
    }
}
