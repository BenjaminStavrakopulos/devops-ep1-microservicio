# Configuración del análisis en SonarQube Cloud (SonarCloud)
sonar.organization=benjaminstavrakopulos
sonar.projectKey=BenjaminStavrakopulos_devops-ep1-microservicio
sonar.projectName=productos-service

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura generada por "npm run test:ci" en el job de pruebas
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bloqueo: el análisis espera el resultado del Quality Gate y falla si no se aprueba
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
