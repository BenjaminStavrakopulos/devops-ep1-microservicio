# Pipeline CI/CD de productos-service
#
#   PR -> develop / main : commits + secretos + dependencias -> lint + tests -> imagen + Trivy -> e2e Compose
#   push -> develop      : controles -> imagen + Trivy -> deploy al entorno "staging" simulado
#   push -> main         : controles -> imagen + Trivy -> publicar imagen en GHCR (entorno "production")
#   Si falla un control de seguridad en develop/main se abre un issue "seguridad" (alerta).
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Si llega un push nuevo a la misma rama/PR, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: productos-service

jobs:
  validar-commits:
    name: Validar convención de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verificar Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATRON='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{3,}'
          INVALIDOS=0
          while IFS= read -r msg; do
            # Los merge commits generados por GitHub/Git se aceptan
            if [[ "$msg" =~ ^Merge\  ]] || [[ "$msg" =~ $PATRON ]]; then
              echo "OK     $msg"
            else
              echo "::error::Mensaje de commit inválido: '$msg'"
              INVALIDOS=$((INVALIDOS + 1))
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if [[ $INVALIDOS -gt 0 ]]; then
            echo "Hay $INVALIDOS commit(s) que no siguen Conventional Commits. Ver docs/GUIA-BUENAS-PRACTICAS.md"
            exit 1
          fi

  lint-y-tests:
    name: Lint y tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      # Política de calidad: falla si la cobertura baja de 90% líneas / 85% ramas / 90% funciones
      - name: Tests unitarios e integración con umbral de cobertura
        shell: bash   # activa pipefail para que "tee" no oculte un fallo de las pruebas
        run: npm run test:ci 2>&1 | tee test-output.txt
      - name: Resumen de pruebas
        if: always()
        run: |
          {
            echo "## Pruebas (Node ${{ matrix.node }})"
            echo '```'
            grep -E '^ℹ (tests|suites|pass|fail|cancelled|skipped|duration_ms)' test-output.txt || true
            echo '```'
            echo "### Cobertura"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reportes de cobertura y JUnit
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: coverage/
          retention-days: 7

  escaneo-secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # se revisa todo el historial, no solo el último commit
      - name: Buscar credenciales filtradas en el historial
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose --exit-code=1

  auditoria-dependencias:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Bloqueo: falla si alguna dependencia tiene vulnerabilidades altas o críticas conocidas
      - name: Vulnerabilidades conocidas (umbral high)
        run: npm audit --audit-level=high
      - name: Verificar firmas de los paquetes del registro
        run: npm audit signatures

  revision-dependencias:
    name: Revisión de dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # Bloquea el PR si agrega dependencias con vulnerabilidades altas o licencias no permitidas
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  build-imagen:
    name: Build de imagen Docker y smoke test
    needs: [lint-y-tests, escaneo-secretos, auditoria-dependencias]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # subir resultados de Trivy a la pestaña Security
    env:
      TRIVY: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen con metadatos de trazabilidad
        run: |
          docker build \
            --build-arg VERSION="$(jq -r .version package.json)" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t $IMAGE_NAME:${{ github.sha }} .
      - name: Información de la imagen
        run: |
          {
            echo "## Imagen construida"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE_NAME:${GITHUB_SHA::7}\` |"
            echo "| Tamaño | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{.Size}}' | numfmt --to=iec) |"
            echo "| Usuario | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{.Config.User}}') |"
            echo "| Versión (label OCI) | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.version"}}') |"
            echo "| Commit (label OCI) | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Escaneo de vulnerabilidades de la imagen (Trivy, reporte SARIF)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" -v "$PWD:/out" $TRIVY \
            image --format sarif --output /out/trivy.sarif $IMAGE_NAME:${{ github.sha }}
      - name: Publicar hallazgos en GitHub Security (alertas)
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-imagen
      # Bloqueo: si la imagen tiene vulnerabilidades HIGH/CRITICAL con parche disponible, no se despliega
      - name: Bloquear si hay vulnerabilidades altas o críticas
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" $TRIVY \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $IMAGE_NAME:${{ github.sha }}
      - name: Generar SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" -v "$PWD:/out" $TRIVY \
            image --format cyclonedx --output /out/sbom.cdx.json $IMAGE_NAME:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-imagen
          path: sbom.cdx.json
          retention-days: 30
      - name: Levantar contenedor endurecido
        run: |
          docker run -d --name smoke -p 3000:3000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 0.5 \
            $IMAGE_NAME:${{ github.sha }}
      - name: Pruebas de humo
        run: bash scripts/smoke-test.sh http://localhost:3000
      - name: Logs del contenedor
        if: always()
        run: docker logs smoke
      - name: Exportar imagen
        run: docker save $IMAGE_NAME:${{ github.sha }} | gzip > imagen.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: imagen.tar.gz
          retention-days: 3

  e2e-compose:
    name: Prueba e2e de la orquestación (Docker Compose)
    if: github.event_name == 'pull_request'
    needs: build-imagen
    runs-on: ubuntu-latest
    env:
      IMAGE: productos-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      - name: Cargar imagen construida
        run: gunzip -c imagen.tar.gz | docker load
      - name: Generar credenciales efímeras de la base de datos
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "POSTGRES_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Desplegar, probar y escalar el stack
        run: bash scripts/desplegar-compose.sh
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --tail 100
      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  deploy-staging:
    name: Deploy a staging (cloud simulado)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-imagen
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:3000
    env:
      IMAGE: productos-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      - name: Cargar imagen construida
        run: gunzip -c imagen.tar.gz | docker load
      - name: Generar credenciales efímeras de la base de datos
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "POSTGRES_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Desplegar stack (lb + api x3 + PostgreSQL), probar y escalar
        run: bash scripts/desplegar-compose.sh
      - name: Resumen del despliegue
        run: |
          {
            echo "## Deploy a staging exitoso"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Imagen | \`$IMAGE\` |"
            echo "| Versión | $(curl -s http://localhost:3000/health | jq -r .version) |"
            echo "| Almacenamiento | $(curl -s http://localhost:3000/health | jq -r .almacenamiento) |"
            echo "| Réplicas de la API | $(docker compose ps api --format '{{.Name}}' | wc -l) |"
            echo ""
            echo '```'
            docker compose ps --format 'table {{.Name}}\t{{.Image}}\t{{.Status}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --tail 100
      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  publicar-imagen:
    name: Publicar imagen en GHCR (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-imagen
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      # Build once, deploy many: se publica exactamente la imagen que pasó las pruebas, sin reconstruirla
      - name: Cargar imagen probada
        run: gunzip -c imagen.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetar y publicar
        id: publicar
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          VERSION="$(jq -r .version package.json)"
          for TAG in "$VERSION" "sha-${GITHUB_SHA::7}" latest; do
            docker tag "$IMAGE_NAME:$GITHUB_SHA" "$REPO:$TAG"
            docker push "$REPO:$TAG"
          done
          DIGEST="$(docker image inspect "$REPO:$VERSION" --format '{{index .RepoDigests 0}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Imagen publicada en GitHub Container Registry"
            echo "- \`$REPO:$VERSION\`"
            echo "- \`$REPO:sha-${GITHUB_SHA::7}\`"
            echo "- \`$REPO:latest\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  alerta-seguridad:
    name: Alerta de seguridad
    # Alerta: si un control de seguridad falla en develop o main, se abre (o actualiza) un issue etiquetado "seguridad".
    # En los PRs el aviso es el propio check en rojo, que bloquea el merge (protección de ramas).
    if: failure() && github.event_name == 'push'
    needs: [escaneo-secretos, auditoria-dependencias, build-imagen]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Crear o actualizar issue de seguridad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULTADOS: |
            | Control | Resultado |
            |---|---|
            | Escaneo de secretos (gitleaks) | ${{ needs.escaneo-secretos.result }} |
            | Auditoría de dependencias (npm audit) | ${{ needs.auditoria-dependencias.result }} |
            | Build de imagen + Trivy | ${{ needs.build-imagen.result }} |
        run: |
          TITULO="Fallo de controles de seguridad en ${GITHUB_REF_NAME}"
          URL_RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          CUERPO=$(printf 'El pipeline detectó un problema de seguridad y **bloqueó el despliegue**.\n\n- Rama: `%s`\n- Commit: `%s`\n- Ejecución: %s\n\n%s\n\nRevisar los logs y la pestaña *Security* del repositorio.' \
            "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$URL_RUN" "$RESULTADOS")
          EXISTENTE=$(gh issue list --label seguridad --state open --search "in:title \"$TITULO\"" --json number --jq '.[0].number')
          if [[ -n "$EXISTENTE" ]]; then
            gh issue comment "$EXISTENTE" --body "$CUERPO"
          else
            gh issue create --title "$TITULO" --label seguridad --body "$CUERPO"
          fi
