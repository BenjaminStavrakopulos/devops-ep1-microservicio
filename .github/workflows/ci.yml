# Pipeline CI/CD de productos-service
#
#   PR -> develop / main : validar commits + escaneo de secretos -> lint + tests -> build imagen + smoke test
#   push -> develop      : lint + tests -> build imagen -> deploy al entorno "staging" simulado
#   push -> main         : lint + tests -> build imagen -> publicar imagen en GHCR (entorno "production")
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Si llega un push nuevo a la misma rama/PR, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: productos-service

jobs:
  validar-commits:
    name: Validar convención de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verificar Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATRON='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{3,}'
          INVALIDOS=0
          while IFS= read -r msg; do
            # Los merge commits generados por GitHub/Git se aceptan
            if [[ "$msg" =~ ^Merge\  ]] || [[ "$msg" =~ $PATRON ]]; then
              echo "OK     $msg"
            else
              echo "::error::Mensaje de commit inválido: '$msg'"
              INVALIDOS=$((INVALIDOS + 1))
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if [[ $INVALIDOS -gt 0 ]]; then
            echo "Hay $INVALIDOS commit(s) que no siguen Conventional Commits. Ver docs/GUIA-BUENAS-PRACTICAS.md"
            exit 1
          fi

  lint-y-tests:
    name: Lint y tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      # Política de calidad: falla si la cobertura baja de 90% líneas / 85% ramas / 90% funciones
      - name: Tests unitarios e integración con umbral de cobertura
        shell: bash   # activa pipefail para que "tee" no oculte un fallo de las pruebas
        run: npm run test:ci 2>&1 | tee test-output.txt
      - name: Resumen de pruebas
        if: always()
        run: |
          {
            echo "## Pruebas (Node ${{ matrix.node }})"
            echo '```'
            grep -E '^ℹ (tests|suites|pass|fail|cancelled|skipped|duration_ms)' test-output.txt || true
            echo '```'
            echo "### Cobertura"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reportes de cobertura y JUnit
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: coverage/
          retention-days: 7

  escaneo-secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # se revisa todo el historial, no solo el último commit
      - name: Buscar credenciales filtradas en el historial
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose --exit-code=1

  build-imagen:
    name: Build de imagen Docker y smoke test
    needs: [lint-y-tests, escaneo-secretos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen con metadatos de trazabilidad
        run: |
          docker build \
            --build-arg VERSION="$(jq -r .version package.json)" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t $IMAGE_NAME:${{ github.sha }} .
      - name: Información de la imagen
        run: |
          {
            echo "## Imagen construida"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE_NAME:${GITHUB_SHA::7}\` |"
            echo "| Tamaño | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{.Size}}' | numfmt --to=iec) |"
            echo "| Usuario | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{.Config.User}}') |"
            echo "| Versión (label OCI) | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.version"}}') |"
            echo "| Commit (label OCI) | $(docker image inspect $IMAGE_NAME:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Levantar contenedor endurecido
        run: |
          docker run -d --name smoke -p 3000:3000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 0.5 \
            $IMAGE_NAME:${{ github.sha }}
      - name: Pruebas de humo
        run: bash scripts/smoke-test.sh http://localhost:3000
      - name: Logs del contenedor
        if: always()
        run: docker logs smoke
      - name: Exportar imagen
        run: docker save $IMAGE_NAME:${{ github.sha }} | gzip > imagen.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: imagen.tar.gz
          retention-days: 3

  e2e-compose:
    name: Prueba e2e de la orquestación (Docker Compose)
    if: github.event_name == 'pull_request'
    needs: build-imagen
    runs-on: ubuntu-latest
    env:
      IMAGE: productos-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      - name: Cargar imagen construida
        run: gunzip -c imagen.tar.gz | docker load
      - name: Generar credenciales efímeras de la base de datos
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "POSTGRES_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Desplegar, probar y escalar el stack
        run: bash scripts/desplegar-compose.sh
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --tail 100
      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  deploy-staging:
    name: Deploy a staging (cloud simulado)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-imagen
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:3000
    env:
      IMAGE: productos-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      - name: Cargar imagen construida
        run: gunzip -c imagen.tar.gz | docker load
      - name: Generar credenciales efímeras de la base de datos
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "POSTGRES_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Desplegar stack (lb + api x3 + PostgreSQL), probar y escalar
        run: bash scripts/desplegar-compose.sh
      - name: Resumen del despliegue
        run: |
          {
            echo "## Deploy a staging exitoso"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Imagen | \`$IMAGE\` |"
            echo "| Versión | $(curl -s http://localhost:3000/health | jq -r .version) |"
            echo "| Almacenamiento | $(curl -s http://localhost:3000/health | jq -r .almacenamiento) |"
            echo "| Réplicas de la API | $(docker compose ps api --format '{{.Name}}' | wc -l) |"
            echo ""
            echo '```'
            docker compose ps --format 'table {{.Name}}\t{{.Image}}\t{{.Status}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --tail 100
      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  publicar-imagen:
    name: Publicar imagen en GHCR (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-imagen
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: imagen-docker
      # Build once, deploy many: se publica exactamente la imagen que pasó las pruebas, sin reconstruirla
      - name: Cargar imagen probada
        run: gunzip -c imagen.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetar y publicar
        id: publicar
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          VERSION="$(jq -r .version package.json)"
          for TAG in "$VERSION" "sha-${GITHUB_SHA::7}" latest; do
            docker tag "$IMAGE_NAME:$GITHUB_SHA" "$REPO:$TAG"
            docker push "$REPO:$TAG"
          done
          DIGEST="$(docker image inspect "$REPO:$VERSION" --format '{{index .RepoDigests 0}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Imagen publicada en GitHub Container Registry"
            echo "- \`$REPO:$VERSION\`"
            echo "- \`$REPO:sha-${GITHUB_SHA::7}\`"
            echo "- \`$REPO:latest\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
