# Escalado horizontal automático según el uso de CPU (relativo a requests.cpu = 100m)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productos-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productos-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Evita oscilaciones: espera a que la carga se mantenga baja antes de quitar réplicas
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
