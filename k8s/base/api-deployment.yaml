apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos-api
  labels:
    app.kubernetes.io/name: productos-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Rolling update sin pérdida de capacidad: primero sube un pod nuevo y solo después baja uno viejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: productos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productos-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: productos-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001     # UID alto sin privilegios (el código es de solo lectura para cualquier usuario)
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas entre nodos para tolerar la caída de uno
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: productos-api
      containers:
        - name: api
          image: productos-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: productos-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: productos-db, key: DATABASE_URL }
          # startup: tolera el arranque mientras se reintenta la conexión a la base de datos
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # liveness: reinicia el contenedor si el proceso deja de responder
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: saca el pod del Service si pierde la base de datos o se está apagando
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Da tiempo a que el pod salga de los endpoints del Service antes de recibir SIGTERM
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
